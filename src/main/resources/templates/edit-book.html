<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow" style="max-width: 500px; margin: 0 auto;">
        <div class="card-header bg-warning text-white">
            <h3><i class="fas fa-edit"></i> Edit Book</h3>
        </div>
        <div class="card-body">
            <!-- IMPORTANT: method="post" and correct action -->
            <form th:action="@{/update/{id}(id=${book.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" name="title" class="form-control"
                           th:value="${book.title}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Author</label>
                    <input type="text" name="author" class="form-control"
                           th:value="${book.author}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Published Date</label>
                    <input type="date" name="publishedDate" class="form-control"
                           th:value="${#temporals.format(book.publishedDate, 'yyyy-MM-dd')}" required>
                </div>
                <button type="submit" class="btn btn-warning">
                    <i class="fas fa-save"></i> Update Book
                </button>
                <a href="/" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
