<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Manager</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h1 class="mb-0"><i class="fas fa-book"></i> Book Manager</h1>
        </div>
        <div class="card-body">
            <!-- Search Bar -->
            <form action="/" method="get" class="mb-4">
                <div class="input-group">
                    <input type="text" name="search" class="form-control"
                           placeholder="Search by title or author..."
                           th:value="${searchKeyword}">
                    <button class="btn btn-outline-primary" type="submit">
                        <i class="fas fa-search"></i> Search
                    </button>
                    <a href="/" class="btn btn-outline-secondary">
                        <i class="fas fa-undo"></i> Clear
                    </a>
                </div>
            </form>

            <!-- Add Book Button -->
            <a href="/add" class="btn btn-success mb-3">
                <i class="fas fa-plus"></i> Add New Book
            </a>

            <!-- Book List -->
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Published Date</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.id}"></td>
                        <td th:text="${book.title}"></td>
                        <td th:text="${book.author}"></td>
                        <td th:text="${#temporals.format(book.publishedDate, 'MMM dd, yyyy')}"></td>
                        <td>
                            <a th:href="@{/edit/{id}(id=${book.id})}" class="btn btn-sm btn-warning">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                            <a th:href="@{/delete/{id}(id=${book.id})}" class="btn btn-sm btn-danger"
                               onclick="return confirm('Are you sure?')">
                                <i class="fas fa-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(books)}">
                        <td colspan="5" class="text-center text-muted">
                            <i class="fas fa-inbox fa-2x d-block mb-2"></i>
                            No books found. Add your first book!
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
